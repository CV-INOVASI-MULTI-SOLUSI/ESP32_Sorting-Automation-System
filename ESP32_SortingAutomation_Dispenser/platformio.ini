; ============================================================
; FEEDER — Firmware terpisah (D30): Dispenser box (Conveyor2 + push)
; Hardware/alamat DIKONFIRMASI sama dgn SORTER/PICKER/STOCKER (board sama)
; ============================================================
[platformio]
default_envs = esp32dev   ; `pio run` biasa cuma build env USB -- env OTA (upload_protocol=espota)
                           ; cuma dipakai eksplisit lewat `pio run -e esp32dev_ota -t upload`

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    emelianov/modbus-esp8266@^4.1.0
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
build_flags =
    -D CORE_DEBUG_LEVEL=1

; Upload via WiFi (OTA) -- tanpa colok USB. Password OTA TIDAK ditaruh di sini (biar tidak
; kecommit ke git) -- diambil dari environment variable OTA_PASS saat upload:
;   PowerShell : $env:OTA_PASS="isi_password"; pio run -e esp32dev_ota -t upload
;   Bash       : OTA_PASS=isi_password pio run -e esp32dev_ota -t upload
; Hostname esp32-dispenser.local harus resolve mDNS -- kalau tidak, ganti upload_port ke IP node.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = esp32-dispenser.local
upload_flags =
    --auth=${sysenv.OTA_PASS}