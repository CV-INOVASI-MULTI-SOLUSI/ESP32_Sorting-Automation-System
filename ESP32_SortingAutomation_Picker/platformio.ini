; ============================================================
; PICKER — Firmware terpisah (D30), tahap 1: LCD 20x4 + Keypad SAJA
; Belum ada MCP23017/PCA9685/Modbus/logic servo -- ditambah bertahap (D32)
; ============================================================
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    emelianov/modbus-esp8266@^4.1.0   ; nama historis, full-support ESP32. ^4.1.1 TIDAK ada di registry, pakai ^4.1.0
build_flags =
    -D CORE_DEBUG_LEVEL=1